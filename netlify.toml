# Netlify deployment configuration for the Tournament Bracket Creator.
#
# - The Vite build outputs the static site to `dist`.
# - Serverless functions live in `netlify/functions`; `suggestions.mts` exposes
#   the AI suggestion proxy at `/api/suggestions` via its own `config.path`.
# - The GEMINI_API_KEY environment variable must be set in the Netlify site
#   settings (Site configuration -> Environment variables). It is read
#   server-side only and never sent to the browser.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Serve source maps explicitly so the SPA catch-all below never rewrites a
# `.map` request to index.html. `force = false` (the default) means Netlify
# only applies this when the actual file exists in `dist`, which it does once
# `build.sourcemap` is enabled in vite.config.ts.
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# SPA fallback: serve index.html for client-side routes. Kept AFTER functions
# and the assets rule so the /api/* function path and static assets (incl.
# `.map` files) are resolved first and not swallowed by this catch-all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
